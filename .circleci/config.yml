            echo "stage ok $(wc -c </tmp/build-05/boson.valley.tenant.bundle)"; echo
      - persist_to_workspace:
          root: /tmp/build-05
          paths:
            - 'boson.valley.tenant.bundle'
  nova-final:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
