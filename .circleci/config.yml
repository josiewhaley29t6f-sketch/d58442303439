      - attach_workspace:
          at: /tmp/build-05
      - run:
          name: Check my upstream
          command: |
            # noop touch read
            : < /tmp/build-05/boson.valley.tenant.bundle && echo "ok" || true
      - run:
          name: Retrieve tree
          command: git clone --depth 1 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack dependencies
          command: tar -xj -f build-binaries-v2.tar.bz2
      - run:
          name: Smoke check
          command: sleep 15
      - run:
          name: Pre-run checks
